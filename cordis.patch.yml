- id: ui-agent-preset
  disabled: false
- insert:
    - id: gvs-team-domain
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 34
        maxTasks: 10000
        maxMessageBytes: 131072
        disposalTimeoutMs: 5000
    - id: gvs-ui
      name: '@makame/dsh-gvs'
    - id: gvs-models
      name: '@makame/dsh-gvs/models'
    - id: gvs-coordinator
      name: '@makame/dsh-gvs/coordinator'
    - id: preset-gvs-local
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: gvs-local
        name: GVS
        description: 'Адаптивная команда: роли под задачу, ожидание зависимостей, UX и игровые проверки.'
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You work inside GVS, an adaptive agent team in DeepSeek Harness. Follow the GVS sections of
                this prompt that apply to your role; a teammate never coordinates the team or calls gvs_run.
          - id: files
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: true
              edit: true
              readLimit: 2000
              readMaxBytes: 22000
          - id: fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
              globMaxResults: 80
              grepMaxMatches: 60
          - id: pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            config:
              enableRunInBackground: true
              promoteOnTimeout: false
            disabled: !!js process.platform !== 'win32'
          - id: bash
            name: '@deepseek-ai/dsh-tool-bash'
            config:
              enableRunInBackground: true
              promoteOnTimeout: false
            disabled: !!js process.platform === 'win32'
          - id: gvs-compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: gvs-compact-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
              - id: gvs-compact-backend
                name: '@makame/dsh-gvs/compaction'
                config:
                  thresholdRatio: 0.6
                  headroomTokens: 32768
                  retainTokens: 12000
                  maxTokens: 8192
                  compactionRetries: 2
                  maxOverflowRetries: 2
              - id: gvs-compact-command
                name: '@deepseek-ai/dsh-command-compact'
          - id: gvs-runtime
            name: '@makame/dsh-gvs/runtime'
            config:
              maxParallel: 4
              maxTasks: 10000
              goalProtocol: 2
              responsiveTesting: true
    - id: gvs-recovery
      name: '@makame/dsh-gvs/recovery'
      config: {}
